<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bracket Viewer</title>
  <link rel="stylesheet" href="jquery.bracket.min.css">
  <script src="jquery.min.js"></script>
  <script src="jquery.bracket.min.js"></script>
  <style>
    body{
      background-color: #1863D6;
    }

    /* Define sprite background */
    .helmet-small{
        background: url("/assets/helmets.png") no-repeat;
        display: inline-block;
    }

    /* Small helmet dimensions */
    .helmet-small {
        width: 16px;
        height: 16px;
    }

    .helmet-small-49ers { background-position: -224px -16px; } 
    .helmet-small-bears { background-position: -208px 0; }    
    .helmet-small-bengals { background-position: -16px 0; }    
    .helmet-small-bills { background-position: 0 0; }    
    .helmet-small-broncos { background-position: -32px 0; }    
    .helmet-small-cardinals { background-position: -192px -48px; } 
    .helmet-small-chargers { background-position: -32px -48px; } 
    .helmet-small-chiefs { background-position: -32px -16px; } 
    .helmet-small-colts { background-position: 0 -16px; }    
    .helmet-small-cowboys { background-position: -192px -64px; } 
    .helmet-small-dolphins { background-position: 0 -32px; }    
    .helmet-small-falcons { background-position: -225px -64px; } 
    .helmet-small-giants { background-position: -192px -16px; } 
    .helmet-small-jets { background-position: 0 -64px; } 
    .helmet-small-lions { background-position: -208px -16px; } 
    .helmet-small-packers { background-position: -208px -32px; } 
    .helmet-small-patriots { background-position: 0 -48px; } 
    .helmet-small-raiders { background-position: -32px -32px; }    
    .helmet-small-rams { background-position: -225px -32px; } 
    .helmet-small-ravens { background-position: -80px -32px; } 
    .helmet-small-redskins { background-position: -192px 0; }    
    .helmet-small-saints { background-position: -225px -48px; } 
    .helmet-small-seahawks { background-position: -32px -64px; } 
    .helmet-small-steelers { background-position: -16px -48px; } 
    .helmet-small-oilers { background-position: -16px -32px; } 
    .helmet-small-vikings { background-position: -112px -16px; } 

    div.jQBracket .team.lose {
        background-color: #fff;
        color: #000;
    }
    div.jQBracket .team:first-child {
        border-bottom: 1px solid #999;
        border-radius: 5px 5px 0 0;
    }
    div.jQBracket .team:nth-of-type(2)  {
      border-radius: 0 0 5px 5px;
    }
    div.jQBracket .team.highlight{
      background-color: #FB599A
    }
    div.jQBracket .connector div.connector{
      background-color: #E0E0E0;
    }
    div.jQBracket .tools{
      display: none;
    }
  </style>
</head>
<body>
  <div id="bracket-container" style="width: 100%; max-width: 800px; margin: 0 auto; padding: 20px;"></div>
  
  <script>
    let _pointSpreads = [];
    let _currentData = [];
    let _admin = false;
    $(function() {      
      _admin = (getCookie('AdminAuthToken') == 'true') ? true : false;
      window.addEventListener('message', function(event) { // Listen for messages from the parent frame
        console.log('message: ' + event.data.type + ' data:' + event.data.data);
        if (event.data.type === 'initBracket') {
          _currentData = event.data.data; 
          renderBracket(_currentData); // Initialize the bracket
          save(_currentData, null) //need to generate the point spreads
        }
        if (event.data.type === 'result') {
          newResultFromParent(event.data.data); // Initialize the bracket
        }
        if (event.data.type === 'pointSpreads') {
          _pointSpreads = event.data.data;
          renderBracket(_currentData); // Initialize the bracket
        }
      });
    });

   function renderBracket(data){
      var bracket = {
        teamWidth: 120,
        scoreWidth: 30,
        matchMargin: 15,
        roundMargin: 50,
        skipConsolationRound: true,
        skipSecondaryFinal: false,
        init: data,
        save: (_admin) ? save : null,
        decorator: { edit: edit,  render: renderMatchup }
      }

      $('#bracket-container').bracket(bracket)
      loadPointSpreads();
    }

    function save(updatedData, userData) {
      _currentData = updatedData;
      let pointSpreadMatchUps = buildPointSpreadMatchps();
      window.parent.postMessage(
        {
          messageType: "bracketUpdate",
          payload: {bracketData: updatedData, pointSpreadMatchUps: pointSpreadMatchUps}
        }  
      );
    }

    function edit(container, data, done) {
      return;      
    }

    function matchClicked(playerElement){
      let team1 = $(playerElement)
      let team2 = team1.closest('.teamContainer').find(`.player:not(.team-${team1.data('playerid')})`);
      let matchupLocation = 'winners';

      if(team1.closest('.finals').length > 0)
        matchupLocation = 'finals';
      else if(team1.closest('.loserBracket').length > 0)
        matchupLocation = 'loserBracket';

      let selectedGame =
      {
        player1ID:team1.data('playerid'),
        player2ID:team2.data('playerid'),
        matchupLocation: matchupLocation
      };
      
      window.parent.postMessage(
        {
          messageType: "gameSelected",
          payload: selectedGame    
        }  
      );
    }

    function renderMatchup(container, data, score, state) {
      const teamContainer = container.closest('.teamContainer');      

      container.empty(); // Clear existing content

      switch(state) {
        case "empty-bye":
          container.append("Bye");
          break;
        case "empty-tbd":
          container.append("");
          break;
        case "entry-no-score":
        case "entry-default-win":
        case "entry-complete": // Render team information          
          let html = buildPlayerHtml(data.player, data.playerId, data.seed, null)
          container.append(html);
          break;
        case "score": // Render custom score element          
          const scoreElement = $('<span>')
            .addClass('custom-score')
            .attr('data-game-id', data.gameId)
            .attr('data-player-id', data.playerId)
            .text(score !== null ? score : '');
          container.append(scoreElement);
          break;
        default:
          container.append("");
      }
    }
    function newResultFromParent(tournamentUpdate){
      let teamContainers = $('.teamContainer')
      let team1Pattern = `.team-${tournamentUpdate.gameResult.player1.playerId}`
      let team2Pattern = `.team-${tournamentUpdate.gameResult.player2.playerId}`
      let matchUpCount = 0;

      for (let i = 0; i < teamContainers.length; i++) {
        if($(teamContainers).eq(i).find(team1Pattern).length > 0 && $(teamContainers).eq(i).find(team2Pattern).length > 0){
          if(matchUpCount == tournamentUpdate.gameResult.matchUpIndex){
            updateMatchup(tournamentUpdate, i, team1Pattern, team2Pattern);
            return;
          }
          matchUpCount++;
        }        
      }
    }

    function updateMatchup(tournamentUpdate, teamContainerIndex, team1Pattern, team2Pattern){
      let teamContainer = $('.teamContainer').eq(teamContainerIndex);
      let team1 = teamContainer.find(team1Pattern);

      team1.parent().parent().children('.score').first().trigger('click');

      $("input").val(tournamentUpdate.gameResult.player1.score);
      $("input").blur();

      setTimeout(() => {
        let teamContainer = $('.teamContainer').eq(teamContainerIndex);
        let team2 = teamContainer.find(team2Pattern);
        team2.parent().parent().children('.score').first().trigger('click');

        $("input").val(tournamentUpdate.gameResult.player2.score);
        $("input").blur();          
      }, 1000);
    }

    function newResultFromParent1(tournamentUpdate){
      console.log('update');
      console.log(tournamentUpdate);
      
      let matchUpCount = 0;
      let matchingTeamIndex = 0;

      let team1Pattern = `.team-${tournamentUpdate.gameResult.player1.playerId}`
      let team2Pattern = `.team-${tournamentUpdate.gameResult.player2.playerId}`

      let team1 = $(team1Pattern);
      let team2 = $(team2Pattern);

      if($('.finals').find(team1Pattern).length > 0)
      {
        team1Pattern = `.finals .team-${tournamentUpdate.gameResult.player1.playerId}`
        team2Pattern = `.finals .team-${tournamentUpdate.gameResult.player2.playerId}`
        
        matchingTeamIndex = $(team1Pattern).length - 1; //looking to see if this is the 1st or 2nd game in the finals

        team1 = $(team1Pattern).eq(matchingTeamIndex);
        team2 = $(team2Pattern).eq(matchingTeamIndex);        
      }
      else{
        for (let i = 1; i <= team1.length; i++) {
          team2 = team1.eq(i-1).closest('.teamContainer').find(team2Pattern)
          if(team2.length > 0)
          {
            if(matchUpCount == tournamentUpdate.gameResult.matchUpIndex)
            {
              team1 = team1.eq(i-1).closest('.teamContainer').find(team1Pattern)
              break;
            }
            
            matchingTeamIndex++;
            matchUpCount++
          }
        }
      }

      updateMatchup(tournamentUpdate, team1, team2Pattern, matchingTeamIndex);
    }

    //need to pass in team2Pattern because after team1 update the reference to the element is lost
    function updateMatchup2(tournamentUpdate, team1, team2Pattern, matchingTeamIndex)
    {
      team1.parent().parent().children('.score').first().trigger('click');

      $("input").val(tournamentUpdate.gameResult.player1.score);
      $("input").blur();

      setTimeout(() => {
        $(team2Pattern).eq(matchingTeamIndex).parent().parent().children('.score').first().trigger('click');
        $("input").val(tournamentUpdate.gameResult.player2.score);
        $("input").blur();          
      }, 1000);
    }
  
    function buildPointSpreadMatchps(){      
      let matchUps = getPointSpreadMatchupsForBracket($('.bracket'), 0);
      matchUps = matchUps.concat(getPointSpreadMatchupsForBracket($('.loserBracket'), 1));
      matchUps = matchUps.concat(getPointSpreadMatchupsForBracket($('.finals'), 2));

      return matchUps;
    }

    function loadPointSpreads(){
      var brackets = ['.bracket', '.loserBracket', '.finals']
      for (let x = 0; x < brackets.length; x++) {
        var containers = $(brackets[x] + ' .teamContainer');

        for (let i = 0; i < containers.length; i++) {
          let container = $(containers[i]);

          for (let j = 0; j < _pointSpreads.length; j++) {
            let player1 = container.find(`[data-playerid="${_pointSpreads[j].player1Id}"]`);
            let player2 = container.find(`[data-playerid="${_pointSpreads[j].player2Id}"]`);
            if(player1.length > 0 && player2.length > 0)
            {
              if($(player1[0]).data('playerid') == _pointSpreads[j].favoredPlayerId){  
                let player1Html = buildPlayerHtml($(player1[0]).data("playername"), $(player1[0]).data("playerid"),$(player1[0]).data("seed"), _pointSpreads[j].spread); 
                $(player1[0]).html(player1Html);
              }              
              else{
                let player2Html = buildPlayerHtml($(player2[0]).data("playername"), $(player2[0]).data("playerid"),$(player2[0]).data("seed"), _pointSpreads[j].spread);
                $(player2[0]).html(player2Html);
              }
            }
          }
        }                
      }    
    }

    function buildPlayerHtml(name, playerId, seed, spread){
      if(spread)
        spread = `(${spread})`;      
      else 
        spread = '';

      return `<div class="player team-${playerId}" data-playerid="${playerId}" data-seed="${seed}" data-playername="${name}" onclick="matchClicked(this)">${seed}. ${name} ${spread}</div>`
    }

    function getPointSpreadMatchupsForBracket(node, braketTypeId){
      var matchUps = [];
      var containers = $(node).find('.teamContainer');
      for (let i = 0; i < containers.length; i++) {
        let container = $(containers[i]);
        if(container.find('.win, .losse, .na').length == 0)
        {
          matchUps.push({
            player1ID: container.find('.player').first().data('playerid'),
            player2ID: container.find('.player').last().data('playerid'),
            bracketTypeId: braketTypeId
          });
        }
      }
      return matchUps;
    }
  
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }
  </script>
</body>
</html>
